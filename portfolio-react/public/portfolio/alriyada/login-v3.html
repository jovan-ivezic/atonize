<main>
<div class="top-bar"></div><!-- /.top-bar -->
	<div class="login-wrap">
		<h1>User Control panel</h1>
		<h3>Secure login</h3>
		<div class="login-form clearfix">
			<div class="login-form__logo">
				<div class="logo">
					<a href="javascript:;" class="site-logo">
						<img src="images/alriyada-logo.png" alt="alriyada logo">
					</a>
					<span>للرقميات وتقنية المعلومات</span>
				</div><!-- /.logo -->	
			</div>
			<div class="login-form__fields">
				<form action="javascript:;" dir="ltr">
					<div>
						<input type="text" class="input input--primary" placeholder="User Name:" />
					</div>
					<div>
						<input type="password" class="input input--primary" placeholder="Password:" />
					</div>
					<div class="capcha">
						<input type="text"  class="input input--primary" placeholder="Enter code:" />
						<img src="images/captcha.jpg" />
						<a href="javascript:;">Reload capcha</a>
					</div><!-- /.capcha -->
					
					<select name="choose language" class="js-select-lang">
						<option value="english">English</option>
						<option value="arabic">Arabic</option>
					</select>
					<button class="btn btn--login btn--blue">Login</button>
				
				</form>
			</div>	
		</div>
